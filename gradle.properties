# A build's heap, and room for the classes it makes (the JVM's own classes plus the build's).
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# Modules build side by side, and task outputs are reused from the build cache (and from other builds).
org.gradle.parallel=true
org.gradle.caching=true
# Reuse what a build worked out unless the scripts or the properties it reads changed. The first build after a change
# configures everything once; later ones only run the tasks that are out of date (Gradle 9's stable configuration cache).
org.gradle.configuration-cache=true
# Kotlin's own compiler daemon: 1-2 GB keeps incremental compiles out of the main build's heap.
kotlin.daemon.jvmargs=-Xmx2g
kotlin.incremental=true
# KSP (Room's schemas, Compose's checks) re-processes only what changed.
ksp.incremental=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# Resources keep their numeric ids fixed, so a resource change doesn't recompile every Kotlin file that reads one.
android.nonFinalResIds=true
# Nothing here uses the old support libraries, so Jetifier needn't rewrite dependencies.
android.enableJetifier=false
kotlin.code.style=official
